[audio]
sound_volume = 0.52999998815357685

[backdrop]
blur_intensity = 0.21999999508261681
enabled = true

[bar.default]
background_opacity = 0.75999998301267624
capsule_thickness = 0.73999998718500137
center = [ "workspaces" ]
concave_edge_corners = false
end = [
    "media",
    "group:g1",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clock",
    "notifications",
    "control-center",
    "session"
]
margin_ends = 0
radius = 0
start = [ "theme_mode", "wallhaven", "bar_3" ]
thickness = 30
widget_spacing = 8

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bar", "bar_2" ]
    opacity = 1.0
    padding = 6.0

[control_center]
show_session_button = false
sidebar = "none"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "clipboard"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
transition = []

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0001220703125
    cy = 943.4998779296875
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 972.5
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [
    "rylos/syncthing",
    "rylos/tailnet",
    "noctalia/wallhaven",
    "raycursive/niri-displays",
    "thepunkoff/pomodoro"
]

[shell]
password_style = "random"

    [shell.animation]
    speed = 1.5500000230967999

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false
    pinned = [ "zen", "org.kde.dolphin", "code", "discord" ]

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_control_center = true
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 40

[theme]
builtin = "Noctalia"
community_palette = "Cream Autumn"
mode = "light"
shell_mode = "dark"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "alacritty", "niri" ]
    community_ids = [ "neovim", "vscode" ]

[wallpaper.default]
path = "/home/simen/Pictures/wallhaven-vp2d98.jpg"

[wallpaper.last]
path = "/home/simen/Pictures/wallhaven-vp2d98.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/simen/Pictures/wallhaven-vp2d98.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/simen/Pictures/wallhaven-vp2d98.jpg"

[widget.bar]
type = "rylos/tailnet:bar"

[widget.bar_2]
type = "rylos/syncthing:bar"

[widget.bar_3]
type = "raycursive/niri-displays:bar"

[widget.clock]
format = "{:%H:%M:%S}"

[widget.media]
enabled = false

[widget.tray]
enabled = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"
